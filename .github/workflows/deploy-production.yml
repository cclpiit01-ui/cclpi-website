name: Build and Deploy to Production (Main Domain)

# Manual trigger only — you decide exactly when this runs.
# Go to GitHub repo > Actions > "Build and Deploy to Production (Main Domain)" > Run workflow
on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Create .env file
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env
          echo "VITE_MAPBOX_ACCESS_TOKEN=${{ secrets.VITE_MAPBOX_ACCESS_TOKEN }}" >> .env
          echo "VITE_SUPABASE_EMPLOYEES_URL=${{ secrets.VITE_SUPABASE_EMPLOYEES_URL }}" >> .env
          echo "VITE_SUPABASE_EMPLOYEES_KEY=${{ secrets.VITE_SUPABASE_EMPLOYEES_KEY }}" >> .env
          echo "VITE_SALES_COUNSELOR_API_URL=${{ secrets.VITE_SALES_COUNSELOR_API_URL }}" >> .env
          echo "VITE_SALES_COUNSELOR_API_TOKEN=${{ secrets.VITE_SALES_COUNSELOR_API_TOKEN }}" >> .env
          echo "VITE_SHOW_CHATBOT=false" >> .env

      - name: Build project
        run: npm run build

      - name: Deploy to Namecheap via FTP (Production - public_html)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER_PROD }}
          username: ${{ secrets.FTP_USERNAME_PROD }}
          password: ${{ secrets.FTP_PASSWORD_PROD }}
          local-dir: ./dist/
          server-dir: ./
